name: CI (self-hosted)
run-name: CM2 matched base/head comparison for fabric PR 389

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    permissions: {}
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  cm2-base-head:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: qvac-ubuntu2204-x64-gpu
    timeout-minutes: 30
    env:
      GGML_N_THREADS: 1
      GGML_NLOOP: 3
      CM2_CORPUS_COUNT: 1024
    steps:
      - name: Diagnostic harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Exact PR base
        uses: actions/checkout@v6
        with:
          ref: f5ddcebbddb0bf1c87b60e5ca81c720d1c5cd5af
          path: base
          persist-credentials: false
      - name: Exact PR head
        uses: actions/checkout@v6
        with:
          ref: 5ceeacf03396914fb805fdc48d8c0c3b6f1a934d
          fetch-depth: 2
          path: head
          persist-credentials: false
      - name: Verify inputs and capture runner environment
        run: |
          mkdir -p cm2-results
          test "$(git -C base rev-parse HEAD)" = f5ddcebbddb0bf1c87b60e5ca81c720d1c5cd5af
          test "$(git -C head rev-parse HEAD)" = 5ceeacf03396914fb805fdc48d8c0c3b6f1a934d
          cmp base/tests/test-backend-ops.cpp head/tests/test-backend-ops.cpp
          cmp base/ci/run.sh head/ci/run.sh
          git -C head diff f5ddcebbddb0bf1c87b60e5ca81c720d1c5cd5af -- ggml/src/ggml-vulkan ggml/src/ggml-quants.c ggml/src/ggml-cpu > cm2-results/kernel-diff.txt
          test ! -s cm2-results/kernel-diff.txt
          uname -a > cm2-results/environment.txt
          c++ --version >> cm2-results/environment.txt
          cmake --version >> cm2-results/environment.txt
          glslc --version >> cm2-results/environment.txt
          nvidia-smi >> cm2-results/environment.txt
          vulkaninfo --summary >> cm2-results/environment.txt
          python3 diagnostics/cm2/patch_test.py base
          python3 diagnostics/cm2/patch_test.py head
          cmp base/tests/test-backend-ops.cpp head/tests/test-backend-ops.cpp
          sha256sum base/tests/test-backend-ops.cpp head/tests/test-backend-ops.cpp > cm2-results/harness-sha256.txt
      - name: Build both revisions with the CI Release configuration
        run: |
          for tree in base head; do
            cmake -S "$tree" -B "$tree/build-cm2" -G 'Unix Makefiles' -DCMAKE_BUILD_TYPE=Release -DLLAMA_FATAL_WARNINGS=ON -DLLAMA_OPENSSL=OFF -DGGML_SCHED_NO_REALLOC=ON -DGGML_METAL=OFF -DGGML_VULKAN=1 2>&1 | tee "cm2-results/$tree-configure.log"
            cmake --build "$tree/build-cm2" --config Release --target test-backend-ops -j4 2>&1 | tee "cm2-results/$tree-build.log"
            cp "$tree/build-cm2/CMakeCache.txt" "cm2-results/$tree-CMakeCache.txt"
          done
      - name: Capture original randomized inputs and replay base/head twice
        run: python3 diagnostics/cm2/compare.py
      - name: Save comparison evidence including the exact tensor corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-389-cm2-base-head
          path: cm2-results
          retention-days: 5
